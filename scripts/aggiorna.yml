name: Aggiorna il sito

on:
  schedule:
    - cron: "17 */2 * * *"   # ogni due ore
  workflow_dispatch:          # e a mano, dal tasto "Run workflow"

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  raccogli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccogli i feed e rigenera la pagina
        run: python scripts/build.py

      - name: Pubblica se e' cambiato qualcosa
        run: |
          git config user.name "politicometro-bot"
          git config user.email "actions@github.com"
          git add index.html dati.json
          if git diff --staged --quiet; then
            echo "Niente di nuovo."
          else
            git commit -m "Aggiornamento automatico $(date -u '+%d.%m.%Y %H:%M UTC')"
            git push
          fi
