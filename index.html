<title>Politicometro</title>

<style>
  :root {
    --bg:#0A0A0C; --sur:#141419; --sur2:#1C1C23; --line:#2A2A33;
    --tx:#F6F6F8; --dim:#9A9AA8;
    --c1:#7B7BFF; --c2:#FF6A55; --c3:#FFB627; --c4:#2DD4BF; --c5:#FF5CA8; --c6:#8BE04F;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#EEEEF2; --sur:#FFF; --sur2:#F4F4F8; --line:#DFDFE7;
            --tx:#0B0B0F; --dim:#61616D;
            --c1:#4A4AD8; --c2:#DB3A22; --c3:#A66E00; --c4:#00897B; --c5:#C42B76; --c6:#3F8B00; }
  }
  :root[data-theme="light"] { --bg:#EEEEF2; --sur:#FFF; --sur2:#F4F4F8; --line:#DFDFE7;
    --tx:#0B0B0F; --dim:#61616D; --c1:#4A4AD8; --c2:#DB3A22; --c3:#A66E00; --c4:#00897B;
    --c5:#C42B76; --c6:#3F8B00; }
  :root[data-theme="dark"] { --bg:#0A0A0C; --sur:#141419; --sur2:#1C1C23; --line:#2A2A33;
    --tx:#F6F6F8; --dim:#9A9AA8; --c1:#7B7BFF; --c2:#FF6A55; --c3:#FFB627; --c4:#2DD4BF;
    --c5:#FF5CA8; --c6:#8BE04F; }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:var(--sans);
         font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:72rem; margin:0 auto; padding:1.25rem 1rem 5rem; }

  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.35rem; }
  .mark { margin:0; font-size:1.3rem; font-weight:900; letter-spacing:-.05em; cursor:pointer; }
  .mark i { font-style:normal;
            background:linear-gradient(96deg,var(--c1),var(--c5) 50%,var(--c3));
            -webkit-background-clip:text; background-clip:text; color:transparent; }
  .mark:focus-visible { outline:2px solid var(--c1); outline-offset:4px; border-radius:6px; }
  .mono { font-family:var(--mono); font-size:.6rem; letter-spacing:.12em;
          text-transform:uppercase; color:var(--dim); font-variant-numeric:tabular-nums; }

  /* barra numeri */
  .barra { display:flex; flex-wrap:wrap; gap:.4rem .5rem; margin-bottom:1.1rem; }
  .f { font:inherit; font-size:.78rem; font-weight:700; color:var(--dim);
       background:var(--sur); border:1px solid var(--line); border-radius:999px;
       padding:.42rem .8rem; cursor:pointer; display:inline-flex; align-items:center; gap:.4rem;
       transition:color 130ms ease,border-color 130ms ease; white-space:nowrap; }
  .f i { font-style:normal; width:8px; height:8px; border-radius:50%; background:var(--k,var(--dim)); }
  .f b { font-family:var(--mono); font-size:.62rem; color:var(--dim); font-weight:400; }
  .f:hover { color:var(--tx); border-color:var(--k,var(--tx)); }
  .f[aria-pressed="true"] { color:var(--k,var(--tx)); border-color:currentColor; }
  .f:focus-visible { outline:2px solid var(--k,var(--c1)); outline-offset:2px; }

  /* griglia densa */
  .griglia { display:grid; grid-template-columns:repeat(auto-fill,minmax(17.5rem,1fr));
             gap:.7rem; align-items:start; }

  .card { position:relative; width:100%; text-align:left; font:inherit; color:inherit;
          cursor:pointer; background:var(--sur); border:1px solid var(--line);
          border-radius:16px; padding:.95rem 1rem .85rem; overflow:hidden;
          display:flex; flex-direction:column; gap:.5rem;
          transition:transform 150ms cubic-bezier(.2,.8,.3,1),border-color 150ms ease; }
  .card::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--k); }
  .card:hover { transform:translateY(-2px); border-color:var(--k); }
  .card:focus-visible { outline:2px solid var(--k); outline-offset:2px; }
  .card.via { display:none; }

  .pill { align-self:flex-start; font-family:var(--mono); font-size:.56rem;
          letter-spacing:.13em; text-transform:uppercase; font-weight:700;
          color:var(--bg); background:var(--k); border-radius:999px; padding:.26rem .6rem; }
  .card h2 { margin:0; font-size:1.08rem; font-weight:900; letter-spacing:-.028em;
             line-height:1.18; text-wrap:balance; }
  .card .hook { margin:0; font-size:.88rem; color:var(--dim); line-height:1.4; }
  .card .foot { display:flex; justify-content:space-between; gap:.8rem; margin-top:.15rem;
                font-family:var(--mono); font-size:.58rem; letter-spacing:.08em;
                text-transform:uppercase; color:var(--dim); }
  .card .foot em { font-style:normal; color:var(--k); font-weight:700; }

  /* dettaglio */
  .apri { display:none; max-width:44rem; }
  .apri.on { display:block; animation:in 280ms cubic-bezier(.2,.8,.3,1) both; }
  .griglia.off, .barra.off { display:none; }

  .back { font:inherit; font-family:var(--mono); font-size:.64rem; letter-spacing:.11em;
          text-transform:uppercase; font-weight:700; color:var(--dim); background:var(--sur);
          border:1px solid var(--line); border-radius:999px; padding:.48rem 1rem;
          cursor:pointer; margin-bottom:1.4rem; }
  .back:hover { color:var(--tx); border-color:var(--k); }
  .back:focus-visible { outline:2px solid var(--k); outline-offset:2px; }

  .apri h2 { margin:.65rem 0 1.35rem; font-size:clamp(1.7rem,7vw,2.5rem); font-weight:900;
             letter-spacing:-.04em; line-height:1.05; text-wrap:balance; }

  .seg { display:flex; gap:.25rem; background:var(--sur); border:1px solid var(--line);
         border-radius:999px; padding:.26rem; margin-bottom:1.35rem; }
  .seg button { flex:1; font:inherit; font-size:.8rem; font-weight:700; color:var(--dim);
                background:none; border:0; border-radius:999px; padding:.52rem .3rem;
                cursor:pointer; transition:background 150ms ease,color 150ms ease; white-space:nowrap; }
  .seg button[aria-selected="true"] { background:var(--k); color:var(--bg); }
  .seg button:focus-visible { outline:2px solid var(--k); outline-offset:2px; }

  .pan { display:none; }
  .pan.on { display:flex; flex-direction:column; gap:1rem; animation:in 200ms ease both; }
  .lead { margin:0; font-size:clamp(1.1rem,4.2vw,1.32rem); font-weight:600;
          line-height:1.42; letter-spacing:-.015em; }

  .conf { display:grid; gap:.5rem; }
  .conf .r { background:var(--sur); border:1px solid var(--line); border-radius:14px;
             padding:.85rem 1rem; display:flex; justify-content:space-between;
             align-items:center; gap:.9rem; flex-wrap:wrap; }
  .conf .r b { font-size:.98rem; font-weight:800; letter-spacing:-.015em; }
  .conf .r b i { display:block; font-style:normal; font-family:var(--mono); font-size:.58rem;
                 letter-spacing:.09em; color:var(--dim); font-weight:400; margin-top:.18rem;
                 text-transform:uppercase; }
  .conf .r u { text-decoration:none; font-family:var(--mono); font-size:.62rem; font-weight:700;
               letter-spacing:.1em; text-transform:uppercase; border:1.5px solid currentColor;
               border-radius:999px; padding:.3rem .65rem; white-space:nowrap; }
  .no { color:var(--c2); } .mezzo { color:var(--c3); } .si { color:var(--c4); }

  .steps { list-style:none; margin:0; padding:0; }
  .steps li { position:relative; padding:0 0 1.2rem 1.95rem; }
  .steps li:last-child { padding-bottom:0; }
  .steps li::before { content:""; position:absolute; left:0; top:.38rem; width:11px; height:11px;
                      border-radius:50%; background:var(--bg); border:3px solid var(--k); }
  .steps li:not(:last-child)::after { content:""; position:absolute; left:4.5px; top:1.2rem;
                      bottom:.1rem; width:2px; background:var(--line); }
  .steps em { font-style:normal; display:block; font-family:var(--mono); font-size:.6rem;
              letter-spacing:.1em; text-transform:uppercase; color:var(--k); font-weight:700;
              margin-bottom:.22rem; }
  .steps p { margin:0; font-size:.95rem; line-height:1.5; }

  .open { background:var(--sur); border:1px solid var(--line); border-radius:16px;
          padding:1rem 1.1rem; }
  .open h3 { margin:0 0 .6rem; font-size:.66rem; font-family:var(--mono); letter-spacing:.12em;
             text-transform:uppercase; color:var(--k); }
  .open ul { margin:0; padding-left:1.05rem; display:flex; flex-direction:column; gap:.45rem; }
  .open li { font-size:.92rem; line-height:1.5; }

  .prove { list-style:none; margin:0; padding:0; display:grid; gap:.5rem; }
  .prove a { display:grid; grid-template-columns:1fr auto; gap:.3rem .8rem; background:var(--sur);
             border:1px solid var(--line); border-radius:14px; padding:.85rem 1rem;
             text-decoration:none; color:inherit;
             transition:border-color 140ms ease,transform 140ms ease; }
  .prove a:hover { border-color:var(--k); transform:translateX(3px); }
  .prove a:focus-visible { outline:2px solid var(--k); outline-offset:2px; }
  .prove .t { font-size:.94rem; font-weight:700; letter-spacing:-.01em; line-height:1.35; }
  .prove .arr { color:var(--k); font-weight:900; align-self:center; }
  .prove .m { grid-column:1/-1; font-family:var(--mono); font-size:.58rem; letter-spacing:.09em;
              text-transform:uppercase; color:var(--dim); }

  footer { margin-top:2.5rem; padding-top:1.1rem; border-top:1px solid var(--line);
           color:var(--dim); font-size:.76rem; display:flex; flex-direction:column; gap:.35rem; }
  footer p { margin:0; }
  footer a { color:var(--dim); }
  footer a:hover { color:var(--tx); }

  @keyframes in { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) {
    .apri.on,.pan.on { animation:none; }
    .card:hover,.prove a:hover { transform:none; }
  }
</style>

<div class="wrap">

  <header class="top">

</div>

const lista = document.getElementById("lista");
const det = document.getElementById("det");
const barra = document.getElementById("barra");

document.getElementById("cont").textContent =
  S.length + " schede · " + S.reduce((n, s) => n + s.prove.length, 0) + " fonti";

/* filtri */
const conteggi = {};
S.forEach(s => conteggi[s.f] = (conteggi[s.f] || 0) + 1);

const tutti = document.createElement("button");
tutti.className = "f"; tutti.type = "button"; tutti.dataset.f = "";
tutti.setAttribute("aria-pressed", "true");
tutti.innerHTML = "Tutte<b>" + S.length + "</b>";
barra.appendChild(tutti);

Object.keys(conteggi).forEach(f => {
  const b = document.createElement("button");
  b.className = "f"; b.type = "button"; b.dataset.f = f;
  b.setAttribute("aria-pressed", "false");
  b.style.setProperty("--k", COL[f]);
  b.innerHTML = "<i></i>" + f + "<b>" + conteggi[f] + "</b>";
  barra.appendChild(b);
});

barra.addEventListener("click", e => {
  const b = e.target.closest(".f");
  if (!b) return;
  barra.querySelectorAll(".f").forEach(x =>
    x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  lista.querySelectorAll(".card").forEach(c =>
    c.classList.toggle("via", !!b.dataset.f && c.dataset.f !== b.dataset.f));
});

/* schede */
S.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "card"; b.type = "button"; b.dataset.f = s.f;
  b.style.setProperty("--k", COL[s.f]);
  b.innerHTML = '<span class="pill">' + s.f + "</span><h2>" + s.t + "</h2>" +
    '<p class="hook">' + s.hook + '</p><span class="foot">' + s.meta + "<em>Apri &rarr;</em></span>";
  b.addEventListener("click", () => apri(i));
  lista.appendChild(b);
});

function conf(rows) {
  if (!rows) return "";
  return '<div class="conf">' + rows.map(r =>
    '<div class="r"><b>' + r[0] + "<i>" + r[1] + "</i></b><u class=\"" + r[3] + '">' + r[2] + "</u></div>"
  ).join("") + "</div>";
}

function apri(i) {
  const s = S[i];
  det.style.setProperty("--k", COL[s.f]);
  det.innerHTML =
    '<button class="back" type="button">&larr; Tutte le schede</button>' +
    '<span class="pill">' + s.f + "</span><h2>" + s.t + "</h2>" +
    '<div class="seg" role="tablist">' +
      '<button role="tab" aria-selected="true" data-p="0">Il fatto</button>' +
      '<button role="tab" aria-selected="false" data-p="1">Com&rsquo;&egrave; andata</button>' +
      '<button role="tab" aria-selected="false" data-p="2">Le prove</button></div>' +
    '<div class="pan on" data-p="0"><p class="lead">' + s.lead + "</p>" + conf(s.conf) + "</div>" +
    '<div class="pan" data-p="1"><ul class="steps">' +
      s.steps.map(x => "<li><em>" + x[0] + "</em><p>" + x[1] + "</p></li>").join("") +
    '</ul><div class="open"><h3>Ancora aperto</h3><ul>' +
      s.aperti.map(x => "<li>" + x + "</li>").join("") + "</ul></div></div>" +
    '<div class="pan" data-p="2"><ul class="prove">' +
      s.prove.map(p => '<li><a href="' + p[3] + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="t">' + p[0] + '</span><span class="arr">&rarr;</span>' +
        '<span class="m">' + p[1] + " &middot; " + p[2] + "</span></a></li>").join("") +
    "</ul></div>";

  det.querySelector(".back").addEventListener("click", chiudi);
  det.querySelectorAll(".seg button").forEach(b => {
    b.addEventListener("click", () => {
      det.querySelectorAll(".seg button").forEach(x =>
        x.setAttribute("aria-selected", x === b ? "true" : "false"));
      det.querySelectorAll(".pan").forEach(p => p.classList.toggle("on", p.dataset.p === b.dataset.p));
    });
  });

  lista.classList.add("off"); barra.classList.add("off"); det.classList.add("on");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function chiudi() {
  det.classList.remove("on"); lista.classList.remove("off"); barra.classList.remove("off");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const h = document.getElementById("home");
h.addEventListener("click", chiudi);
h.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); chiudi(); }
});
</script>
