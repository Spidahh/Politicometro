<title>Politicometro</title>

<style>
  :root {
    --bg:#0B0D11; --card:#12161D; --card2:#191E27; --line:#242B36;
    --text:#EDF1F6; --dim:#8B96A6; --acc:#4DD4F0; --hot:#FF6B4A;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#F2F5F8; --card:#FFF; --card2:#E9EEF4; --line:#DAE1E9;
            --text:#0E141B; --dim:#5B6778; --acc:#0A7488; --hot:#C4442A; }
  }
  :root[data-theme="light"] { --bg:#F2F5F8; --card:#FFF; --card2:#E9EEF4; --line:#DAE1E9;
    --text:#0E141B; --dim:#5B6778; --acc:#0A7488; --hot:#C4442A; }
  :root[data-theme="dark"] { --bg:#0B0D11; --card:#12161D; --card2:#191E27; --line:#242B36;
    --text:#EDF1F6; --dim:#8B96A6; --acc:#4DD4F0; --hot:#FF6B4A; }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
         font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:46rem; margin:0 auto; padding:1.25rem 1rem 5rem; }

  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:1rem;
          flex-wrap:wrap; padding-bottom:.9rem; border-bottom:1px solid var(--line);
          margin-bottom:1.75rem; }
  .logo { margin:0; font-size:clamp(1.45rem,6vw,1.9rem); font-weight:800;
          letter-spacing:-.035em; line-height:1; cursor:pointer; }
  .logo b { color:var(--acc); }
  .lab { font-family:var(--mono); font-size:.64rem; letter-spacing:.13em;
         text-transform:uppercase; color:var(--dim); font-variant-numeric:tabular-nums; margin:0; }

  /* ---- elenco schede ---- */
  .schede { display:flex; flex-direction:column; gap:.7rem; }

  .scheda {
    width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:1.05rem 1.15rem; display:flex; flex-direction:column; gap:.55rem;
    transition:border-color 130ms ease, transform 130ms ease;
  }
  .scheda:hover { border-color:var(--acc); transform:translateY(-1px); }
  .scheda:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }

  .formato {
    align-self:flex-start; font-family:var(--mono); font-size:.6rem; letter-spacing:.11em;
    text-transform:uppercase; font-weight:700; color:var(--acc);
    border:1px solid currentColor; border-radius:999px; padding:.24rem .55rem;
  }
  .scheda h2 { margin:0; font-size:1.15rem; font-weight:800; letter-spacing:-.02em;
               line-height:1.3; text-wrap:balance; }
  .scheda p { margin:0; color:var(--dim); font-size:.94rem; }
  .quando { font-family:var(--mono); font-size:.63rem; letter-spacing:.08em;
            color:var(--dim); font-variant-numeric:tabular-nums; }

  /* ---- scheda aperta ---- */
  .aperta { display:none; }
  .aperta.on { display:block; animation:up 250ms ease both; }
  .schede.off { display:none; }

  .indietro { font:inherit; font-family:var(--mono); font-size:.66rem; letter-spacing:.1em;
              text-transform:uppercase; color:var(--dim); background:none; border:0;
              padding:.4rem 0; cursor:pointer; margin-bottom:1rem; }
  .indietro:hover { color:var(--acc); }
  .indietro:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }

  .aperta h2 { margin:.5rem 0 1.25rem; font-size:clamp(1.4rem,5.5vw,1.9rem); font-weight:800;
               letter-spacing:-.025em; line-height:1.2; text-wrap:balance; }

  .livelli { display:flex; gap:.4rem; margin-bottom:1.25rem; flex-wrap:wrap; }
  .liv { font:inherit; font-size:.8rem; color:var(--dim); background:var(--card);
         border:1px solid var(--line); border-radius:999px; padding:.42rem .85rem;
         cursor:pointer; transition:border-color 120ms ease,color 120ms ease; }
  .liv:hover { border-color:var(--acc); }
  .liv[aria-selected="true"] { color:var(--acc); border-color:var(--acc); font-weight:600; }
  .liv:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }

  .pannello { display:none; }
  .pannello.on { display:flex; flex-direction:column; gap:1rem; }

  .pannello p { margin:0; }
  .pannello h3 { margin:.4rem 0 0; font-size:.95rem; font-weight:800; letter-spacing:-.01em; }

  .grosso { font-size:1.1rem; line-height:1.55; }

  /* cronologia */
  .crono { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .crono li { position:relative; padding:0 0 1rem 1.5rem; }
  .crono li:last-child { padding-bottom:0; }
  .crono li::before { content:""; position:absolute; left:0; top:.5rem; width:9px; height:9px;
                      border-radius:50%; background:var(--dim); }
  .crono li:last-child::before { background:var(--hot); }
  .crono li:not(:last-child)::after { content:""; position:absolute; left:4px; top:1.15rem;
                      bottom:.1rem; width:1px; background:var(--line); }
  .crono em { font-style:normal; display:block; font-family:var(--mono); font-size:.63rem;
              letter-spacing:.08em; color:var(--dim); margin-bottom:.15rem;
              font-variant-numeric:tabular-nums; }

  /* tabella stesso metro */
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; min-width:30rem; }
  th { text-align:left; font-family:var(--mono); font-size:.6rem; letter-spacing:.1em;
       text-transform:uppercase; color:var(--dim); font-weight:400;
       padding:0 .7rem .5rem 0; border-bottom:1px solid var(--line); }
  td { padding:.65rem .7rem .65rem 0; border-bottom:1px solid var(--line); vertical-align:top; }
  td:last-child, th:last-child { padding-right:0; }
  td b { color:var(--hot); font-family:var(--mono); font-size:.68rem;
         letter-spacing:.06em; text-transform:uppercase; }
  td span { display:block; font-family:var(--mono); font-size:.62rem; color:var(--dim);
            margin-top:.15rem; }

  /* irrisolti */
  .aperti { background:var(--card); border:1px solid var(--line); border-radius:10px;
            padding:.9rem 1rem; }
  .aperti ul { margin:.5rem 0 0; padding-left:1.1rem; display:flex; flex-direction:column; gap:.35rem; }
  .aperti li { font-size:.92rem; }

  /* prove */
  .prove { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.4rem; }
  .prove a { display:flex; flex-wrap:wrap; gap:.15rem .7rem; align-items:baseline;
             background:var(--card); border:1px solid var(--line); border-radius:9px;
             padding:.7rem .85rem; text-decoration:none; color:inherit;
             transition:border-color 120ms ease; }
  .prove a:hover { border-color:var(--acc); }
  .prove a:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .prove .d { font-family:var(--mono); font-size:.63rem; color:var(--dim);
              font-variant-numeric:tabular-nums; }
  .prove .t { font-size:.92rem; font-weight:600; flex:1 1 14rem; }
  .prove .f { font-family:var(--mono); font-size:.6rem; letter-spacing:.08em;
              text-transform:uppercase; color:var(--dim); }

  footer { border-top:1px solid var(--line); padding-top:1rem; margin-top:2.5rem;
           color:var(--dim); font-size:.8rem; display:flex; flex-direction:column; gap:.35rem; }
  footer p { margin:0; }
  footer a { color:var(--dim); }
  footer a:hover { color:var(--acc); }

  @keyframes up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .aperta.on { animation:none; } .scheda:hover { transform:none; } }
</style>

<div class="wrap">

  <header class="head">
    <h1 class="logo" id="home" tabindex="0" role="button">Politico<b>metro</b></h1>
    <p class="lab">4 schede &middot; 28.07.2026</p>
  </header>

  <div class="schede" id="elenco"></div>
  <div class="aperta" id="dettaglio"></div>

  <footer>
    <p>Ogni scheda si legge a tre livelli: venti secondi, due minuti, tutte le prove.</p>
    <p>Un&rsquo;indagine non &egrave; una condanna. Una condanna non definitiva pu&ograve; essere ribaltata. Un rapporto societario non &egrave; un illecito.</p>
    <p><a href="https://github.com/Spidahh/Politicometro" target="_blank" rel="noopener noreferrer">codice</a></p>
  </footer>

</div>

      ["2023", "Primo anno pieno di governo: gli sbarchi aumentano rispetto al 2022. La misura non viene attuata e smette di comparire nel dibattito."]
    ],
    irrisolti: [

      "Nessuna spiegazione pubblica sul perch&eacute; la misura sia stata abbandonata."
    ],
    prove: [
      ["&mdash;", "I fatti dietro la promessa: il blocco navale di Fratelli d&rsquo;Italia", "Pagella Politica", "https://pagellapolitica.it/articoli/promessa-fdi-blocco-navale"],

    titolo: "Le carte lette in aula sul caso Cospito",
    quando: "2023 - 2026",
    breve: "Tre anni dopo, condanna confermata in appello. Non &egrave; definitiva.",
    venti: "Nel 2023 un deputato lesse in aula il contenuto di conversazioni registrate in carcere, coperte da segreto. Gliele aveva passate l&rsquo;allora sottosegretario alla Giustizia. Nel maggio 2026 la condanna a otto mesi &egrave; stata confermata in appello, con la Procura generale che aveva chiesto l&rsquo;assoluzione.",

    ],
    irrisolti: [
      "La sentenza non &egrave; definitiva: manca il giudizio della Cassazione.",
      "Nessun procedimento a carico di chi ha letto le carte in aula, coperto dall&rsquo;insindacabilit&agrave; delle opinioni espresse in Parlamento."
    ],
    prove: [
      ["20.05.2026", "Confermata in appello la condanna a Delmastro", "ANSA", "https://www.ansa.it/sito/notizie/politica/2026/05/20/confermata-in-appello-la-condanna-a-delmastro-per-il-caso-cospito_e032639e-e7cd-4a6e-8d94-f33f2f4665aa.html"],
      ["20.05.2026", "Otto mesi per rivelazione del segreto d&rsquo;ufficio", "Sky TG24", "https://tg24.sky.it/cronaca/2026/05/20/caso-cospito-andrea-delmastro-condanna-appello"],

    ]

  {
    formato: "Nebbia",
    titolo: "Le intercettazioni che pescano anche chi non &egrave; indagato",

    venti: "Due emendamenti di Fratelli d&rsquo;Italia vogliono riammettere le intercettazioni cosiddette &laquo;a strascico&raquo;, quelle che registrano anche persone non indagate, per mafia, terrorismo e tratta di esseri umani. Forza Italia &egrave; contraria. Al momento non si vota e non si sa come finir&agrave;.",

    ],

    ],

      ["27.07.2026", "Cosa sono le intercettazioni a strascico che stanno facendo litigare la destra", "Il Post", "https://www.ilpost.it/2026/07/27/intercettazioni-a-strascico-senato-berrino-sisler/"],
      ["14.07.2026", "Niente accordo fra FdI e Forza Italia, l&rsquo;emendamento non si vota", "Il Fatto Quotidiano", "https://www.ilfattoquotidiano.it/2026/07/14/intercettazioni-emendamento-melillo-maggioranza-notizie/8448228/"],
      ["&mdash;", "Forza Italia: no alle intercettazioni a strascico", "Il Messaggero", "https://www.ilmessaggero.it/politica/antimafia_forza_italia_sfida_fdi_no_alle_intercettazioni_strascico-9657409.html"]
    ]
  }
];

const elenco = document.getElementById("elenco");
const dettaglio = document.getElementById("dettaglio");

SCHEDE.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "scheda";
  b.type = "button";
  b.innerHTML =
    '<span class="formato">' + s.formato + "</span>" +
    "<h2>" + s.titolo + "</h2>" +
    "<p>" + s.breve + "</p>" +
    '<span class="quando">' + s.quando + "</span>";
  b.addEventListener("click", () => apri(i));
  elenco.appendChild(b);
});

function tabella(t) {
  if (!t) return "";
  return '<div class="scroll"><table><thead><tr>' +
    t.teste.map(h => '<th scope="col">' + h + "</th>").join("") +
    "</tr></thead><tbody>" +
    t.righe.map(r => "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("") +
    "</tbody></table></div>";
}

function apri(i) {
  const s = SCHEDE[i];

  dettaglio.innerHTML =
    '<button class="indietro" type="button">&larr; Tutte le schede</button>' +
    '<span class="formato">' + s.formato + "</span>" +
    "<h2>" + s.titolo + "</h2>" +
    '<div class="livelli" role="tablist">' +
      '<button class="liv" role="tab" aria-selected="true"  data-p="0">20 secondi</button>' +
      '<button class="liv" role="tab" aria-selected="false" data-p="1">2 minuti</button>' +
      '<button class="liv" role="tab" aria-selected="false" data-p="2">Tutte le prove</button>' +
    "</div>" +

    '<div class="pannello on" data-p="0">' +
      '<p class="grosso">' + s.venti + "</p>" +
      tabella(s.tabella) +
    "</div>" +

    '<div class="pannello" data-p="1">' +
      "<h3>Come &egrave; andata</h3>" +
      '<ul class="crono">' +
        s.crono.map(c => "<li><em>" + c[0] + "</em>" + c[1] + "</li>").join("") +
      "</ul>" +
      '<div class="aperti"><h3>Punti ancora aperti</h3><ul>' +
        s.irrisolti.map(x => "<li>" + x + "</li>").join("") +
      "</ul></div>" +
    "</div>" +

    '<div class="pannello" data-p="2">' +
      '<ul class="prove">' +
        s.prove.map(p =>
          '<li><a href="' + p[3] + '" target="_blank" rel="noopener noreferrer">' +
          '<span class="d">' + p[0] + "</span>" +
          '<span class="t">' + p[1] + "</span>" +
          '<span class="f">' + p[2] + "</span></a></li>"
        ).join("") +
      "</ul>" +
    "</div>";

  dettaglio.querySelector(".indietro").addEventListener("click", chiudi);

  dettaglio.querySelectorAll(".liv").forEach(b => {
    b.addEventListener("click", () => {
      dettaglio.querySelectorAll(".liv").forEach(x =>
        x.setAttribute("aria-selected", x === b ? "true" : "false"));
      dettaglio.querySelectorAll(".pannello").forEach(p =>
        p.classList.toggle("on", p.dataset.p === b.dataset.p));
    });
  });

  elenco.classList.add("off");
  dettaglio.classList.add("on");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function chiudi() {
  dettaglio.classList.remove("on");
  elenco.classList.remove("off");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("home").addEventListener("click", chiudi);
document.getElementById("home").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); chiudi(); }
});
